[theme]
base = "dark"
primaryColor = "#58A6FF"
backgroundColor = "#0A0E14"
secondaryBackgroundColor = "#141B26"
textColor = "#F0F6FC"
font = "sans serif"

[server]
headless = true
# enableXsrfProtection já força o CORS; não definir enableCORS evita o
# warning de conflito ("server.enableCORS is being overridden").
enableXsrfProtection = true
# Site não tem upload de arquivos: reduz a superfície de ataque
# limitando o tamanho máximo aceito pelo servidor (padrão: 200 MB).
maxUploadSize = 5

[client]
# Segurança: não expor stack traces/caminhos do servidor para visitantes.
showErrorDetails = false
# Esconde a toolbar de desenvolvedor para quem visita o site.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
